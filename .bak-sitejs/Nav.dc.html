<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./theme.css">
<!-- Fonts here are only for viewing this component standalone. On import the
     runtime reads just the template block, so this head is ignored and the
     host page's fonts apply. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script src="./support.js"></script>
</head>
<body>
<!--
  Shared announcement bar + top nav — a Design Component, imported by every
  page with a dc-import tag naming "Nav".

      current   which link to highlight: home | brokeros | trust | pricing |
                contact. Omit for pages with no nav entry of their own
                (Blog, BookDemo, Privacy, Terms). "home" also switches the
                landing-page anchors to in-page form so smooth scroll works.
      show-bar  false hides the announcement bar. Pages that expose an
                `announcementBar` editor prop pass it straight through.

  This component owns the theme toggle and the phone number, so pages no
  longer each carry their own copy. Contact details stay base64 in source.

  Same three conventions as Footer.dc.html — filename must be Nav.dc.html,
  markup must sit in the template element below, and nothing outside that
  element may contain a literal x-dc opening tag (parseDcText takes the FIRST
  regex match on raw source, so even a mention in a comment breaks it).
-->
<x-dc>

<!-- ══ Announcement bar ══ -->
<sc-if value="{{ showBar }}" hint-placeholder-val="{{ true }}">
  <div style="background: #17251F; color: #D8E4DC; text-align: center; padding: 10px 24px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;">
    <span style="color: #8FC7A8; letter-spacing: 0.1em;">✦</span>
    <span>FREE CONCIERGE ONBOARDING</span>
    <span style="color: #4E6459;">·</span>
    <span style="color: #B9C6BC;">FROM SPREADSHEETS, EMAILS, PAPERS, OR ANY AMS — LIVE IN UNDER 3 WEEKS</span>
    <a href="{{ barHref }}" style="color: #8FC7A8; text-decoration: none; border-bottom: 1px solid #4E6459; padding-bottom: 1px;" style-hover="border-color: #8FC7A8;">DETAILS →</a>
  </div>
</sc-if>

<!-- Phone strip — only below 620px, where .bw-phone-label drops out of the
     header and the number would otherwise collapse to a bare icon. Sits
     outside <header> so it scrolls away; the sticky header keeps the icon. -->
<a class="bw-phonestrip" href="{{ phoneHref }}">
  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.12em; color: var(--mut);">TALK TO US</span>
  <span style="font-family: 'Instrument Sans', sans-serif; font-size: 15px; font-weight: 600; color: var(--ink);">{{ phoneDisplay }}</span>
</a>

<!-- ══ Nav ══ -->
<header style="position: sticky; top: 0; z-index: 50; background: var(--navbg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line2);">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 32px; height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 32px;">
    <a href="{{ homeHref }}" style="font-family: 'Instrument Serif', serif; font-size: 26px; text-decoration: none; color: var(--ink); letter-spacing: -0.01em;">Starlight<span style="color: var(--accent);">.</span></a>
    <nav class="bw-navlinks" style="display: flex; gap: 26px; font-size: 14.5px; font-weight: 500;">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
        <a href="{{ l.href }}" style="{{ l.style }}" style-hover="color: var(--accent);">{{ l.label }}</a>
      </sc-for>
    </nav>
    <div style="display: flex; gap: 20px; align-items: center;">
      <button onClick="{{ toggleMode }}" title="{{ modeTitle }}" aria-label="{{ modeTitle }}" style="width: 32px; height: 32px; border-radius: 50%; background: var(--tintg); border: 1px solid var(--tintgb); color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; padding: 0; flex-shrink: 0;">{{ modeIcon }}</button>
      <a href="{{ phoneHref }}" aria-label="{{ phoneAria }}" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink);" style-hover="color: var(--accent);">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: var(--tintg); border: 1px solid var(--tintgb); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" fill="var(--accent)" /></svg>
        </span>
        <span class="bw-phone-label" style="display: flex; flex-direction: column; line-height: 1.2; white-space: nowrap;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: var(--mut);">TALK TO US</span>
          <span style="font-family: 'Instrument Sans', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: normal; color: var(--ink);">{{ phoneDisplay }}</span>
        </span>
      </a>
      <a href="BookDemo.dc.html" class="bw-navlinks" style="color: var(--ink); text-decoration: none; font-size: 14.5px; font-weight: 500; padding: 9px 14px;" style-hover="color: var(--accent);">Sign in</a>
      <a href="BookDemo.dc.html" style="display: none; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 14.5px; font-weight: 600; padding: 10px 18px; border-radius: 9px; transition: background 0.15s;" style-hover="background: var(--accent-h);">Book a demo</a>
      <button class="bw-navburger" onClick="{{ toggleMenu }}" aria-label="{{ menuLabel }}" aria-expanded="{{ menuExpanded }}" style="width: 32px; height: 32px; border-radius: 50%; background: var(--tintg); border: 1px solid var(--tintgb); color: var(--accent); cursor: pointer; align-items: center; justify-content: center; font-size: 15px; line-height: 1; padding: 0; flex-shrink: 0;">{{ menuIcon }}</button>
    </div>
  </div>

  <!-- Mobile drop-down. Hidden above 1000px by CSS, so it can stay mounted
       without leaking onto desktop if the viewport is resized while open.
       The click handler sits on the container so any link inside closes it —
       needed for same-page anchors, which don't reload and would otherwise
       leave the panel hanging open over the section you just jumped to. -->
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav class="bw-mobilemenu" aria-label="Mobile" onClick="{{ closeMenu }}">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
        <a href="{{ l.href }}" style="{{ l.mobileStyle }}">{{ l.label }}</a>
      </sc-for>
      <a href="BookDemo.dc.html">Sign in</a>
      <a href="BookDemo.dc.html" class="bw-mobilecta">Book a demo</a>
    </nav>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false };

  // Landing-page sections are anchors; everything else is its own page.
  LINKS = [
    { key: 'brokeros',  label: 'BrokerOS',     href: 'BrokerOS.dc.html' },
    { key: 'how',       label: 'How it works', anchor: '#how' },
    { key: 'migration', label: 'Migration',    anchor: '#migration' },
    { key: 'fill',      label: 'Fill engine',  anchor: '#fill' },
    { key: 'trust',     label: 'Trust',        href: 'Trust.dc.html' },
    { key: 'pricing',   label: 'Pricing',      href: 'Pricing.dc.html' },
    { key: 'contact',   label: 'Contact',      href: 'Contact.dc.html' }
  ];

  // Contact details are base64 in source so a plain-text scraper reading the
  // page HTML finds nothing. One copy here now, instead of one per page —
  // which is what makes rotating the number a single-line change.
  _decode(b64) { return atob(b64); }

  renderVals() {
    const current = this.props.current ?? '';
    // On the landing page the section links stay in-page so `scroll-behavior:
    // smooth` applies; everywhere else they need the full path.
    const isHome = current === 'home';
    const at = (a) => (isHome ? a : 'index.html' + a);

    const bar = this.props.showBar;
    const dark = document.documentElement.dataset.mode === 'dark';

    const phone = this._decode('KzEzMTIyMDAxOTky');
    const phoneDisplay = this._decode('KzEgKDMxMikgMjAwLTE5OTI=');

    return {
      showBar: bar !== false && bar !== 'false',
      homeHref: isHome ? '#top' : 'index.html',
      barHref: at('#migration'),

      links: this.LINKS.map(l => ({
        label: l.label,
        href: l.anchor ? at(l.anchor) : l.href,
        style: 'text-decoration: none; color: '
             + (l.key === current ? 'var(--accent)' : 'var(--ink)') + ';',
        // The mobile panel gets its padding and borders from .bw-mobilemenu a
        // in theme.css; only the current-page colour needs overriding here.
        mobileStyle: l.key === current ? 'color: var(--accent);' : ''
      })),

      menuOpen: this.state.menuOpen,
      menuIcon: this.state.menuOpen ? '✕' : '☰',
      menuLabel: this.state.menuOpen ? 'Close menu' : 'Open menu',
      menuExpanded: this.state.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),

      // The theme is already applied pre-paint by the inline script in each
      // page's head; this only flips it. Re-rendering just this component is
      // enough because the tokens it swaps are global CSS variables.
      toggleMode: () => {
        const m = dark ? 'light' : 'dark';
        try { localStorage.setItem('bw-mode', m); } catch (e) {}
        try { document.documentElement.dataset.mode = m; } catch (e) {}
        this.forceUpdate();
      },
      modeIcon: dark ? '☀' : '☾',
      modeTitle: dark ? 'Switch to light mode' : 'Switch to dark mode',

      phoneHref: 'tel:' + phone,
      phoneDisplay,
      // The visible number is hidden under 620px by .bw-phone-label, so the
      // link needs its own accessible name on mobile.
      phoneAria: 'Call Starlight at ' + phoneDisplay
    };
  }
}
</script>
</body>
</html>
